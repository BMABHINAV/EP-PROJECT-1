; PlatformIO Project Configuration File
; CHEST MODULE — ESP32-S3 (Main controller with TinyML)
; ========================================================

[platformio]
default_envs = chest_module

[env:chest_module]
platform        = espressif32
board           = esp32s3dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; Libraries
lib_deps =
  ; Pulse oximetry
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
  ; Temperature
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.7
  ; IMU
  electroniccats/MPU6050 @ ^1.3.0
  ; LoRa
  sandeepmistry/LoRa @ ^0.8.0
  ; BLE (built-in ESP-IDF)
  ; FRAM storage
  robtillaart/FRAM_I2C @ ^0.6.1
  ; TensorFlow Lite Micro
  https://github.com/tensorflow/tflite-micro-arduino-examples

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; Model config
  -DTFLITE_MODEL_VERSION=1
  ; Pin definitions
  -DLORA_SCK=18 -DLORA_MISO=19 -DLORA_MOSI=23 -DLORA_SS=5 -DLORA_RST=14 -DLORA_DIO0=26
  -DONE_WIRE_BUS=4
  -DMAX30102_SDA=21 -DMAX30102_SCL=22

board_build.mcu   = esp32s3
board_build.f_cpu = 240000000L
board_build.psram = enabled
